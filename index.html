<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tower of Ascension</title>

    <script src="viewport.js" defer></script>
    <script src="break_eternity.js"></script>
    <script src="main.js"></script>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="debug.css" disabled>
</head>
<body>
    <div id="viewport" class="viewport">
        <div id="locked" style="position: absolute; z-index: 10; top: 16px; left: 16px;">
            <button class="tab-button" onclick="showOptions()">Options</button>
            <button class="tab-button" onclick="showOptions()">Statistics</button>
            <div id="options-tab" class="fixed-tab">
                <div class="sticky-note-top"></div>
                <!-- ancient technique of magic offsetting blocks -->
                <div style="position: relative; height: 40px;"></div> 

                <button class="options-button" onclick="displayHome()">Teleport back to origin</button>
            </div>
            <div id="statistics-tab" class="fixed-tab" style="display: none;">
                <!-- <button class="options-button" onclick="displayHome()">Teleport back to origin</button> -->
            </div>
        </div>
        <div id="world" class="world">
        </div>
    </div>
</body>
</html>
